<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Express Boilerplate Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>

<body class="bg-[#0f172a] text-slate-100 min-h-screen p-6 md:p-12">

    <div class="max-w-6xl mx-auto">

        <!-- Header Section -->
        <header class="mb-10 pb-6 border-b border-slate-800 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <div class="flex items-center gap-3">
                    <div class="p-2.5 bg-blue-600/20 text-blue-400 rounded-xl border border-blue-500/30">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                        </svg>
                    </div>
                    <h1 class="text-3xl font-bold tracking-tight text-white">Express Boilerplate Hub</h1>
                </div>
                <p class="text-slate-400 mt-2 text-sm md:text-base">
                    Select a starter template to copy pre-configured Express.js backend structures with built-in schemas.
                </p>
            </div>
            <span class="inline-flex items-center gap-2 self-start md:self-auto px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Ready to Deploy
            </span>
        </header>

        <!-- Main Actions Grid -->
        <main>
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Available Templates</h2>
                <span class="text-xs text-slate-500">3 Blueprints available</span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

                <!-- Card 1: Mailer Service -->
                <button onclick="sendAction('sendWithMail')" class="group relative flex flex-col justify-between bg-slate-900/60 border border-slate-800 rounded-2xl p-6 text-left hover:border-blue-500/50 hover:bg-slate-800/50 transition-all duration-300 hover:shadow-xl hover:shadow-blue-500/5">
                    <div>
                        <div class="flex items-center justify-between mb-4">
                            <div class="p-3 bg-blue-500/10 text-blue-400 rounded-xl group-hover:scale-110 transition-transform duration-300">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                                </svg>
                            </div>
                            <span class="text-xs px-2.5 py-1 bg-slate-800 text-slate-400 rounded-lg group-hover:bg-blue-500/20 group-hover:text-blue-300 transition-colors">Nodemailer + Queues</span>
                        </div>

                        <h3 class="text-lg font-semibold text-white group-hover:text-blue-400 transition-colors mb-2">
                            Mail Delivery Service
                        </h3>

                        <p class="text-xs text-slate-400 leading-relaxed mb-4">
                            Transactional email service complete with queue management, HTML templates, and delivery status logs.
                        </p>

                        <!-- Schema Highlights -->
                        <div class="border-t border-slate-800/80 pt-3 mt-3">
                            <span class="text-[11px] font-medium text-slate-500 uppercase tracking-wider block mb-2">Included Schemas</span>
                            <div class="flex flex-wrap gap-1.5">
                                <span class="px-2 py-0.5 text-[11px] bg-slate-800/80 text-slate-300 rounded border border-slate-700/50">EmailLogs</span>
                                <span class="px-2 py-0.5 text-[11px] bg-slate-800/80 text-slate-300 rounded border border-slate-700/50">Templates</span>
                                <span class="px-2 py-0.5 text-[11px] bg-slate-800/80 text-slate-300 rounded border border-slate-700/50">QueueJobs</span>
                            </div>
                        </div>
                    </div>

                    <div class="mt-6 flex items-center text-xs font-medium text-blue-400 group-hover:translate-x-1 transition-transform">
                        Copy Boilerplate Code
                        <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                        </svg>
                    </div>
                </button>

                <!-- Card 2: Tally Server -->
                <button onclick="sendAction('tallyServer')" class="group relative flex flex-col justify-between bg-slate-900/60 border border-slate-800 rounded-2xl p-6 text-left hover:border-emerald-500/50 hover:bg-slate-800/50 transition-all duration-300 hover:shadow-xl hover:shadow-emerald-500/5">
                    <div>
                        <div class="flex items-center justify-between mb-4">
                            <div class="p-3 bg-emerald-500/10 text-emerald-400 rounded-xl group-hover:scale-110 transition-transform duration-300">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                                </svg>
                            </div>
                            <span class="text-xs px-2.5 py-1 bg-slate-800 text-slate-400 rounded-lg group-hover:bg-emerald-500/20 group-hover:text-emerald-300 transition-colors">Accounting / ERP</span>
                        </div>

                        <h3 class="text-lg font-semibold text-white group-hover:text-emerald-400 transition-colors mb-2">
                            Tally ERP Integration
                        </h3>

                        <p class="text-xs text-slate-400 leading-relaxed mb-4">
                            Backend for sync operations, financial ledgers, voucher generation, and transaction history parsing.
                        </p>

                        <!-- Schema Highlights -->
                        <div class="border-t border-slate-800/80 pt-3 mt-3">
                            <span class="text-[11px] font-medium text-slate-500 uppercase tracking-wider block mb-2">Included Schemas</span>
                            <div class="flex flex-wrap gap-1.5">
                                <span class="px-2 py-0.5 text-[11px] bg-slate-800/80 text-slate-300 rounded border border-slate-700/50">Vouchers</span>
                                <span class="px-2 py-0.5 text-[11px] bg-slate-800/80 text-slate-300 rounded border border-slate-700/50">Ledgers</span>
                                <span class="px-2 py-0.5 text-[11px] bg-slate-800/80 text-slate-300 rounded border border-slate-700/50">SyncLogs</span>
                            </div>
                        </div>
                    </div>

                    <div class="mt-6 flex items-center text-xs font-medium text-emerald-400 group-hover:translate-x-1 transition-transform">
                        Copy Boilerplate Code
                        <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                        </svg>
                    </div>
                </button>

                <!-- Card 3: Lab Management -->
                <button onclick="sendAction('labManagement')" class="group relative flex flex-col justify-between bg-slate-900/60 border border-slate-800 rounded-2xl p-6 text-left hover:border-purple-500/50 hover:bg-slate-800/50 transition-all duration-300 hover:shadow-xl hover:shadow-purple-500/5">
                    <div>
                        <div class="flex items-center justify-between mb-4">
                            <div class="p-3 bg-purple-500/10 text-purple-400 rounded-xl group-hover:scale-110 transition-transform duration-300">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path>
                                </svg>
                            </div>
                            <span class="text-xs px-2.5 py-1 bg-slate-800 text-slate-400 rounded-lg group-hover:bg-purple-500/20 group-hover:text-purple-300 transition-colors">Healthcare / LIMS</span>
                        </div>

                        <h3 class="text-lg font-semibold text-white group-hover:text-purple-400 transition-colors mb-2">
                            Lab Management (LIMS)
                        </h3>

                        <p class="text-xs text-slate-400 leading-relaxed mb-4">
                            Complete system for diagnostic test bookings, patient records, inventory tracking, and lab reports.
                        </p>

                        <!-- Schema Highlights -->
                        <div class="border-t border-slate-800/80 pt-3 mt-3">
                            <span class="text-[11px] font-medium text-slate-500 uppercase tracking-wider block mb-2">Included Schemas</span>
                            <div class="flex flex-wrap gap-1.5">
                                <span class="px-2 py-0.5 text-[11px] bg-slate-800/80 text-slate-300 rounded border border-slate-700/50">Patients</span>
                                <span class="px-2 py-0.5 text-[11px] bg-slate-800/80 text-slate-300 rounded border border-slate-700/50">TestOrders</span>
                                <span class="px-2 py-0.5 text-[11px] bg-slate-800/80 text-slate-300 rounded border border-slate-700/50">LabReports</span>
                            </div>
                        </div>
                    </div>

                    <div class="mt-6 flex items-center text-xs font-medium text-purple-400 group-hover:translate-x-1 transition-transform">
                        Copy Boilerplate Code
                        <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                        </svg>
                    </div>
                </button>

            </div>
        </main>

        <!-- Dynamic Status Notification -->
        <div id="status" class="hidden mt-8 rounded-xl border border-blue-500/30 bg-blue-500/10 px-5 py-4 text-sm text-blue-300 flex items-center gap-3 backdrop-blur-sm">
            <svg class="w-5 h-5 flex-shrink-0 text-blue-400 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
            </svg>
            <span id="status-text">Processing request...</span>
        </div>

        <!-- Dynamic Summary Output -->
        <div id="summary" class="hidden mt-6 rounded-2xl border border-slate-800 bg-slate-900/80 p-6 backdrop-blur-md">
            <h4 class="text-sm font-semibold text-slate-200 mb-2">Action Output</h4>
            <div id="summary-content" class="text-xs text-slate-400 font-mono leading-relaxed overflow-x-auto">
                <!-- Generated details will appear here -->
            </div>
        </div>

    </div>

    <!-- JavaScript Handler -->
    <script>
        function sendAction(actionType) {
            const statusEl = document.getElementById('status');
            const summaryEl = document.getElementById('summary');
            
            // Show status
            statusEl.classList.remove('hidden');
            statusEl.querySelector('#status-text').innerText = `Generating setup for ${actionType}...`;

            // Simulate copied action / backend trigger
            setTimeout(() => {
                statusEl.classList.add('hidden');
                summaryEl.classList.remove('hidden');
                
                document.getElementById('summary-content').innerHTML = `
                    <div class="text-emerald-400 mb-2">✓ ${actionType} boilerplate copied to clipboard successfully!</div>
                    <p class="text-slate-400">Ready to paste into your Express project structure (routes, controllers, and Mongoose schemas initialized).</p>
                `;
            }, 600);
        }
    </script>
</body>

</html>
