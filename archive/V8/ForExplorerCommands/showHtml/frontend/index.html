<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#1e1e1e] text-white min-h-screen p-6">

    <div class="max-w-3xl mx-auto">

        <div class="mb-6">
            <h1 class="text-2xl font-semibold">
                BoilerPlate
            </h1>

            <p class="text-sm text-gray-400 mt-1">
                simple yet functional code on express
            </p>
        </div>

        <!-- gen actions -->
        <div class="mt-6">

            <div class="text-sm text-gray-400 mb-3">
                Actions
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <button onclick="sendWithMail()" class="group bg-[#252526]
                    border border-gray-700
                    rounded-xl p-5 text-left
                    hover:border-blue-500
                    hover:bg-[#2d2d30]
                    transition-all">
                    <div class="text-2xl mb-2">🔢</div>

                    <div class="font-medium">
                        sendWithMail
                    </div>

                    <div class="text-sm text-gray-400">
                        sendWithMail corresponding BoilerPlate is copied
                    </div>
                </button>

                <button onclick="tallyServer()" class="group bg-[#252526]
                    border border-gray-700
                    rounded-xl p-5 text-left
                    hover:border-blue-500
                    hover:bg-[#2d2d30]
                    transition-all">
                    <div class="text-2xl mb-2">🔢</div>

                    <div class="font-medium">
                        tallyServer
                    </div>

                    <div class="text-sm text-gray-400">
                        tallyServer corresponding BoilerPlate is copied
                    </div>
                </button>

                <button onclick="sendAction('labManagement')" class="group bg-[#252526]
                    border border-gray-700
                    rounded-xl p-5 text-left
                    hover:border-blue-500
                    hover:bg-[#2d2d30]
                    transition-all">
                    <div class="text-2xl mb-2">🔢</div>

                    <div class="font-medium">
                        labManagement
                    </div>

                    <div class="text-sm text-gray-400">
                        labManagement corresponding BoilerPlate is copied
                    </div>
                </button>
            </div>

        </div>

        <!-- Status -->
        <div id="status" class="hidden mt-6 rounded-xl border border-blue-600/30
    bg-blue-500/10 px-4 py-3 text-blue-300">
        </div>

        <!-- Summary -->
        <div id="summary" class="hidden mt-4 rounded-xl border border-gray-700
    bg-[#252526] p-4">
        </div>
    </div>

</body>

</html>
